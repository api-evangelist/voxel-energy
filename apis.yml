description: Voxel Energy is a Y Combinator Winter 2026 company building energy-independent,
  off-grid data centers powered by on-site solar generation and second-life EV batteries
  over a DC microgrid architecture. Founded in 2025 by ex-Tesla engineers Casey Spencer,
  Max Pfeiffer, and Evan Schmidt, the San Francisco company delivers modular, prefabricated
  data center power systems that bypass multi-year utility interconnection queues,
  taking facilities from site selection to commissioning in months. Voxel Energy is
  an infrastructure hardware company and does not currently publish a public API or
  developer program.
